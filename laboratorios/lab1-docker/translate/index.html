<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Translator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            padding: 12px 24px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover:not(:disabled) {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            opacity: 0.8;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            min-height: 60px;
            white-space: pre-wrap;
        }
        .footer {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 0;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>En -&gt; Es Translator</h2>
        <textarea
            id="inputText"
            placeholder="Enter English text to translate..."
            aria-label="Text to translate"
        ></textarea>
        <button id="translateBtn" onclick="translateText()">Translate</button>
        <div
            class="result"
            id="outputText"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >Translation will appear here...</div>
        <p class="footer">by EHBC</p>
    </div>

    <script>
        async function translateText() {
            const text = document.getElementById('inputText').value;
            const output = document.getElementById('outputText');
            const button = document.getElementById('translateBtn');

            if (!text.trim()) {
                output.innerText = "Please enter some text.";
                return;
            }

            button.disabled = true;
            button.innerText = "Translating...";
            output.innerText = "";

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                // innerText escapa HTML automáticamente (previene XSS)
                output.innerText = response.ok
                    ? data.translation
                    : `Error ${response.status}: ${data.detail}`;
            } catch (error) {
                output.innerText = "Network connection error. Please try again.";
                console.error("Translation error:", error);
            } finally {
                button.disabled = false;
                button.innerText = "Translate";
            }
        }
    </script>
</body>
</html>
